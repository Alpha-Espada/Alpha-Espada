<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<foreignObject x="20" y="10" width="960" height="450">
<div xmlns="http://www.w3.org/1999/xhtml" class="win">
<style>
/* ===== shared terminal theme (same in every assets/*.svg) ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
.win {
  position: relative; width: 960px; height: 450px; overflow: hidden;
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
  color: #c9d1d9; background-color: #0a0f15;
  background-image: linear-gradient(#00ff9f12 1px, transparent 1px), linear-gradient(90deg, #00ff9f12 1px, transparent 1px);
  background-size: 32px 32px;
  border: 1px solid #00ff9f66; border-radius: 12px;
}
.win::before { /* scanlines */
  content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(transparent 0 3px, #0000004d 3px 4px);
}
.win::after { /* moving scan beam */
  content: ''; position: absolute; left: 0; right: 0; top: -140px; height: 140px; z-index: 2;
  background: linear-gradient(transparent, #00ff9f12, transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep { to { transform: translateY(730px); } }
.bar { display: flex; align-items: center; height: 34px; padding: 0 16px; font-size: 13px; color: #5c7a70; background: #0f1620; border-bottom: 1px solid #00ff9f33; }
.dots { display: flex; gap: 8px; width: 120px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; }
.dots i:nth-child(2) { background: #ffbd2e; }
.dots i:nth-child(3) { background: #27c93f; }
.bar .title { flex: 1; text-align: center; }
.bar .tag { width: 120px; text-align: right; font-size: 11px; }
.g { color: #00ff9f; } .c { color: #00e5ff; } .d { color: #5c7a70; }
.glow { text-shadow: 0 0 6px #00ff9f, 0 0 16px #00ff9f80; }
.fade { opacity: 0; animation: fade .6s ease forwards; }
@keyframes fade { to { opacity: 1; } }
/* typing: set --d (delay), --t (duration), --s (steps ≈ number of characters) */
.type { display: inline-block; white-space: pre; clip-path: inset(0 100% 0 0); animation: type var(--t, 1.5s) steps(var(--s, 40)) var(--d, 0s) forwards; }
@keyframes type { to { clip-path: inset(0 0 0 0); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ===== neofetch-only styles ===== */
.glowbg { position: absolute; left: 0; top: 60px; width: 400px; height: 400px; background: radial-gradient(closest-side, #00ff9f22, transparent); }
.main { position: relative; padding: 20px 26px; }
.cmd { font-size: 16px; height: 34px; }
.cols { display: flex; gap: 40px; }
.sword {
  width: 320px; padding-left: 44px; font-size: 15px; line-height: 20px; font-family: inherit;
  color: #00ff9f; filter: drop-shadow(0 0 5px #00ff9f99); animation-delay: .7s;
}
.info { animation-delay: .8s; }
.user { font-size: 18px; font-weight: 700; }
.rule { height: 1px; width: 250px; margin: 12px 0 14px; background: #5c7a70; }
.rows { display: grid; grid-template-columns: 110px auto; row-gap: 5px; font-size: 15px; line-height: 19px; }
.rows dt { color: #00e5ff; font-weight: 700; }
.palette { display: flex; gap: 4px; margin-top: 18px; animation-delay: 1.9s; }
.palette i { width: 32px; height: 16px; }
</style>

<div class="bar"><span class="dots"><i/><i/><i/></span><span class="title">alpha@espada: ~ — neofetch</span><span class="tag"/></div>
<div class="glowbg"/>

<div class="main">
  <div class="cmd"><span class="type" style="--d:.2s; --t:.5s; --s:10"><span class="c">$</span> neofetch</span></div>
  <div class="cols">
<pre class="sword fade">      /\
     /  \
     |  |
     |  |
     |  |
     |  |
     |  |
     |  |
     |  |
     |  |
.____|  |____.
'----.  .----'
     |##|
     |##|
     |##|
     (__)</pre>

    <!-- ===== edit your info below: <dt> = label, <dd> = value ===== -->
    <div class="info fade">
      <div class="user"><span class="g">nabil</span>@<span class="c">ibrahim-oladosu</span></div>
      <div class="rule"/>
      <dl class="rows">
        <dt>role</dt>     <dd>Full-Stack Developer</dd>
        <dt>company</dt>  <dd>Tireda Technology</dd>
        <dt>focus</dt>    <dd>Mobile · Web · Backend · Cloud</dd>
        <dt>frontend</dt> <dd>Angular · TypeScript · Tailwind · Ionic</dd>
        <dt>backend</dt>  <dd>Go · Node.js · Express · Prisma · PostgreSQL</dd>
        <dt>cloud</dt>    <dd>AWS · Docker · Firebase · CI/CD</dd>
        <dt>gamedev</dt>  <dd>Unity · C# — learning 3D</dd>
        <dt>seeking</dt>  <dd>collaborations, anything I can help with</dd>
        <dt>pronouns</dt> <dd>He/Him</dd>
        <dt>likes</dt>    <dd>snakes · dogs</dd>
        <dt>discord</dt>  <dd>alpha.espada</dd>
      </dl>
      <div class="palette fade">
        <i style="background:#1f2a37"/><i style="background:#ff5f56"/><i style="background:#00ff9f"/><i style="background:#ffbd2e"/>
        <i style="background:#00e5ff"/><i style="background:#ff2e88"/><i style="background:#a78bfa"/><i style="background:#c9d1d9"/>
      </div>
    </div>
  </div>
</div>
</div>
</foreignObject>
</svg>
