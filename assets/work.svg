<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
<foreignObject x="20" y="10" width="960" height="380">
<div xmlns="http://www.w3.org/1999/xhtml" class="win">
<style>
/* ===== shared terminal theme (same in every assets/*.svg) ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
.win {
  position: relative; width: 960px; height: 380px; overflow: hidden;
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
  color: #c9d1d9; background-color: #0a0f15;
  background-image: linear-gradient(#00ff9f12 1px, transparent 1px), linear-gradient(90deg, #00ff9f12 1px, transparent 1px);
  background-size: 32px 32px;
  border: 1px solid #00ff9f66; border-radius: 12px;
}
.win::before { /* scanlines */
  content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(transparent 0 3px, #0000004d 3px 4px);
}
.win::after { /* moving scan beam */
  content: ''; position: absolute; left: 0; right: 0; top: -140px; height: 140px; z-index: 2;
  background: linear-gradient(transparent, #00ff9f12, transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep { to { transform: translateY(660px); } }
.bar { display: flex; align-items: center; height: 34px; padding: 0 16px; font-size: 13px; color: #5c7a70; background: #0f1620; border-bottom: 1px solid #00ff9f33; }
.dots { display: flex; gap: 8px; width: 120px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; }
.dots i:nth-child(2) { background: #ffbd2e; }
.dots i:nth-child(3) { background: #27c93f; }
.bar .title { flex: 1; text-align: center; }
.bar .tag { width: 120px; text-align: right; font-size: 11px; }
.g { color: #00ff9f; } .c { color: #00e5ff; } .d { color: #5c7a70; }
.glow { text-shadow: 0 0 6px #00ff9f, 0 0 16px #00ff9f80; }
.fade { opacity: 0; animation: fade .6s ease forwards; }
@keyframes fade { to { opacity: 1; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.chip { display: inline-block; margin-right: 6px; padding: 3px 10px; font-size: 12px; color: #00ff9f; background: #00ff9f14; border: 1px solid #00ff9f73; border-radius: 5px; }

/* ===== work-only styles ===== */
.main { padding: 18px 30px; }
.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.head h2 { font-size: 19px; font-weight: 400; }
.head h2 b { color: #00ff9f; }
.head .status { font-size: 13px; color: #5c7a70; }
.dot { display: inline-block; width: 10px; height: 10px; margin-right: 10px; border-radius: 50%; background: #00ff9f; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { position: relative; height: 120px; padding: 16px 20px; background: #0f1620; border: 1px solid #00ff9f4d; border-radius: 8px; }
.card::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; background: #00ff9f; }
.card h3 { display: flex; justify-content: space-between; font-size: 15px; }
.card h3 small { font-size: 11px; font-weight: 400; letter-spacing: 1px; color: #00ff9f; }
.card h3 small i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #00ff9f; }
.card p { margin: 10px 0 12px; font-size: 14px; }
</style>

<div class="bar"><span class="dots"><i/><i/><i/></span><span class="title">tireda-technology :: ./work</span><span class="tag">tty2</span></div>

<!-- ===== edit the text below ===== -->
<div class="main">
  <div class="head">
    <h2><b>▸ Full-Stack Developer</b> @ Tireda Technology</h2>
    <span class="status"><span class="dot pulse"/>4 modules running</span>
  </div>
  <div class="grid">
    <div class="card fade" style="animation-delay:.4s">
      <h3><span><span class="d">[01]</span> <span class="c">MOBILE</span></span><small><i class="pulse"/>RUNNING</small></h3>
      <p>Cross-platform iOS &amp; Android apps</p>
      <span class="chip">Ionic</span><span class="chip">Angular</span><span class="chip">Capacitor</span><span class="chip">Firebase</span>
    </div>
    <div class="card fade" style="animation-delay:.55s">
      <h3><span><span class="d">[02]</span> <span class="c">WEB</span></span><small><i class="pulse"/>RUNNING</small></h3>
      <p>Customer web apps &amp; admin dashboards</p>
      <span class="chip">Angular</span><span class="chip">TypeScript</span><span class="chip">Tailwind</span>
    </div>
    <div class="card fade" style="animation-delay:.7s">
      <h3><span><span class="d">[03]</span> <span class="c">BACKEND</span></span><small><i class="pulse"/>RUNNING</small></h3>
      <p>REST APIs &amp; backend services</p>
      <span class="chip">Go</span><span class="chip">Node.js</span><span class="chip">Express</span><span class="chip">Prisma</span><span class="chip">PostgreSQL</span>
    </div>
    <div class="card fade" style="animation-delay:.85s">
      <h3><span><span class="d">[04]</span> <span class="c">DEVOPS</span></span><small><i class="pulse"/>RUNNING</small></h3>
      <p>Serverless deploys, containers, CI</p>
      <span class="chip">AWS</span><span class="chip">Serverless</span><span class="chip">Docker</span><span class="chip">CI/CD</span>
    </div>
  </div>
</div>
</div>
</foreignObject>
</svg>
