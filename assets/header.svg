<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Courier New',monospace}.fade{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.2}}.sweep{animation:sweep 7s linear infinite}@keyframes sweep{from{transform:translateY(-140px)}to{transform:translateY(320px)}}.g1{opacity:0;animation:g1 4s infinite 2.2s}.g2{opacity:0;animation:g2 4s infinite 2.2s}@keyframes g1{0%,90%,100%{opacity:0;transform:translate(0,0)}91%{opacity:.8;transform:translate(-4px,1px)}94%{opacity:.8;transform:translate(3px,-1px)}97%{opacity:.5;transform:translate(-2px,0)}}@keyframes g2{0%,90%,100%{opacity:0;transform:translate(0,0)}91%{opacity:.8;transform:translate(4px,-1px)}94%{opacity:.8;transform:translate(-3px,1px)}97%{opacity:.5;transform:translate(2px,0)}}</style>
