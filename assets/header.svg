<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<foreignObject x="20" y="10" width="960" height="280">
<div xmlns="http://www.w3.org/1999/xhtml" class="win">
<style>
/* ===== shared terminal theme (same in every assets/*.svg) ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
.win {
  position: relative; width: 960px; height: 280px; overflow: hidden;
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
  color: #c9d1d9; background-color: #0a0f15;
  background-image: linear-gradient(#00ff9f12 1px, transparent 1px), linear-gradient(90deg, #00ff9f12 1px, transparent 1px);
  background-size: 32px 32px;
  border: 1px solid #00ff9f66; border-radius: 12px;
}
.win::before { /* scanlines */
  content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(transparent 0 3px, #0000004d 3px 4px);
}
.win::after { /* moving scan beam */
  content: ''; position: absolute; left: 0; right: 0; top: -140px; height: 140px; z-index: 2;
  background: linear-gradient(transparent, #00ff9f12, transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep { to { transform: translateY(560px); } }
.bar { display: flex; align-items: center; height: 34px; padding: 0 16px; font-size: 13px; color: #5c7a70; background: #0f1620; border-bottom: 1px solid #00ff9f33; }
.dots { display: flex; gap: 8px; width: 120px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; }
.dots i:nth-child(2) { background: #ffbd2e; }
.dots i:nth-child(3) { background: #27c93f; }
.bar .title { flex: 1; text-align: center; }
.bar .tag { width: 120px; text-align: right; font-size: 11px; }
.g { color: #00ff9f; } .c { color: #00e5ff; } .d { color: #5c7a70; }
.glow { text-shadow: 0 0 6px #00ff9f, 0 0 16px #00ff9f80; }
.fade { opacity: 0; animation: fade .6s ease forwards; }
@keyframes fade { to { opacity: 1; } }
/* typing: set --d (delay), --t (duration), --s (steps ≈ number of characters) */
.type { display: inline-block; white-space: pre; clip-path: inset(0 100% 0 0); animation: type var(--t, 1.5s) steps(var(--s, 40)) var(--d, 0s) forwards; }
@keyframes type { to { clip-path: inset(0 0 0 0); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ===== header-only styles ===== */
.glowbg { position: absolute; left: -40px; top: 20px; width: 680px; height: 280px; background: radial-gradient(closest-side, #00ff9f22, transparent); }
.main { position: relative; padding: 22px 36px; }
.line { font-size: 19px; height: 33px; }
.name {
  position: relative; display: inline-block; margin: 6px 0 10px;
  font-size: 42px; font-weight: 800; letter-spacing: 1px; line-height: 1.2; color: #00ff9f;
  animation-delay: 1.1s;
}
.name::before, .name::after { content: attr(data-text); position: absolute; left: 0; top: 0; opacity: 0; text-shadow: none; }
.name::before { color: #ff2e88; animation: g1 4s infinite 2.2s; }
.name::after  { color: #00e5ff; animation: g2 4s infinite 2.2s; }
@keyframes g1 { 0%, 90%, 100% { opacity: 0; transform: none; } 91% { opacity: .8; transform: translate(-4px, 1px); } 94% { opacity: .8; transform: translate(3px, -1px); } 97% { opacity: .5; transform: translate(-2px, 0); } }
@keyframes g2 { 0%, 90%, 100% { opacity: 0; transform: none; } 91% { opacity: .8; transform: translate(4px, -1px); } 94% { opacity: .8; transform: translate(-3px, 1px); } 97% { opacity: .5; transform: translate(2px, 0); } }
.prompt { font-size: 16px; margin-top: 6px; animation-delay: 5s; }
.cursor { display: inline-block; width: 10px; height: 18px; vertical-align: -3px; background: #00ff9f; }

.monitor {
  position: absolute; right: 30px; top: 52px; width: 300px; height: 200px; padding: 16px;
  font-size: 14px; background: #0f1620cc; border: 1px solid #00ff9f40; border-radius: 8px;
}
.monitor .row { display: flex; height: 25px; }
.monitor .row span:first-child { width: 72px; color: #5c7a70; }
.eq { display: flex; align-items: flex-end; gap: 7px; height: 48px; margin-top: 4px; }
.eq i { width: 12px; background: #00ff9fbf; border-radius: 1px; animation: eq 1.8s ease-in-out infinite; }
@keyframes eq { 0%, 100% { height: 8px; } 25% { height: 40px; } 50% { height: 18px; } 75% { height: 30px; } }
</style>

<div class="bar"><span class="dots"><i/><i/><i/></span><span class="title">alpha@espada: ~ — zsh</span><span class="tag">tty1</span></div>
<div class="glowbg"/>

<!-- ===== edit the text below ===== -->
<div class="main">
  <div class="line"><span class="type" style="--d:.3s; --t:.6s; --s:8; font-size:18px"><span class="c">$</span> whoami</span></div>
  <div><span class="name glow fade" data-text="Nabil Ibrahim-Oladosu">Nabil Ibrahim-Oladosu</span></div>
  <div class="line"><span class="type" style="--d:1.6s"><span class="g">&gt;</span> full-stack developer @ tireda technology</span></div>
  <div class="line"><span class="type" style="--d:3.3s"><span class="g">&gt;</span> mobile · web · backend · cloud · game dev</span></div>
  <div class="prompt fade"><span class="g">alpha@espada</span><span class="d">:</span><span class="c">~</span>$ <span class="cursor blink"/></div>
</div>

<div class="monitor">
  <div class="d" style="font-size:13px; margin-bottom:12px">// sys.monitor</div>
  <div class="row"><span>status</span><span class="g"><span class="pulse">●</span> online</span></div>
  <div class="row"><span>role</span><span>full-stack dev</span></div>
  <div class="row"><span>engine</span><span>unity // c#</span></div>
  <div class="d" style="font-size:12px; margin-top:4px">activity</div>
  <div class="eq">
    <i style="animation-duration:1.6s"/><i style="animation-duration:2.1s; animation-delay:-.4s"/><i style="animation-duration:1.9s; animation-delay:-1s"/>
    <i style="animation-duration:2.4s; animation-delay:-.2s"/><i style="animation-duration:1.7s; animation-delay:-1.3s"/><i style="animation-duration:2.2s; animation-delay:-.7s"/>
    <i style="animation-duration:1.8s; animation-delay:-.5s"/><i style="animation-duration:2.5s; animation-delay:-1.6s"/><i style="animation-duration:1.6s; animation-delay:-.9s"/>
    <i style="animation-duration:2s; animation-delay:-.3s"/><i style="animation-duration:2.3s; animation-delay:-1.1s"/><i style="animation-duration:1.7s; animation-delay:-.6s"/>
    <i style="animation-duration:2.2s; animation-delay:-1.4s"/><i style="animation-duration:1.9s; animation-delay:-.1s"/>
  </div>
</div>
</div>
</foreignObject>
</svg>
