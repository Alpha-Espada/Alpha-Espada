<rect x="26" y="128" width="56.0" height="24" rx="5" fill="#00ff9f" fill-opacity=".08" stroke="#00ff9f" stroke-opacity=".45"/><text x="54.0" y="144" text-anchor="middle" font-size="12" fill="#00ff9f">Unity</text><rect x="90.0" y="128" width="34.4" height="24" rx="5" fill="#00ff9f" fill-opacity=".08" stroke="#00ff9f" stroke-opacity=".45"/><text x="107.2" y="144" text-anchor="middle" font-size="12" fill="#00ff9f">C#</text><rect x="132.4" y="128" width="34.4" height="24" rx="5" fill="#00ff9f" fill-opacity=".08" stroke="#00ff9f" stroke-opacity=".45"/><text x="149.6" y="144" text-anchor="middle" font-size="12" fill="#00ff9f">2D</text>
<text x="454" y="171" text-anchor="end" font-size="13" fill="#00e5ff">[ ▶ view source ]</text>

