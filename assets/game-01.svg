<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190">
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Courier New',monospace}.fade{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.2}}.sweep{animation:sweep 7s linear infinite}@keyframes sweep{from{transform:translateY(-140px)}to{transform:translateY(210px)}}.g1{opacity:0;animation:g1 4s infinite 2.2s}.g2{opacity:0;animation:g2 4s infinite 2.2s}@keyframes g1{0%,90%,100%{opacity:0;transform:translate(0,0)}91%{opacity:.8;transform:translate(-4px,1px)}94%{opacity:.8;transform:translate(3px,-1px)}97%{opacity:.5;transform:translate(-2px,0)}}@keyframes g2{0%,90%,100%{opacity:0;transform:translate(0,0)}91%{opacity:.8;transform:translate(4px,-1px)}94%{opacity:.8;transform:translate(-3px,1px)}97%{opacity:.5;transform:translate(2px,0)}}</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00ff9f" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".3"/></pattern>
<linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9f" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9f" stop-opacity=".07"/><stop offset="1" stop-color="#00ff9f" stop-opacity="0"/></linearGradient>
<radialGradient id="rg"><stop offset="0" stop-color="#00ff9f" stop-opacity=".13"/><stop offset="1" stop-color="#00ff9f" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<rect x="6" y="6" width="468" height="178" rx="12" fill="#0a0f15"/>
<clipPath id="k8"><rect x="6" y="6" width="468" height="178" rx="12"/></clipPath>
<g clip-path="url(#k8)">
<rect x="6" y="6" width="468" height="178" fill="url(#grid)"/>
<rect x="6" y="6" width="468" height="34" fill="#0f1620"/>
